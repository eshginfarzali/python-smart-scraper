name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check and test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (format check)
        run: black --check .

      - name: mypy (strict)
        run: mypy

      - name: pytest (with coverage)
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t python-smart-scraper:ci .

      - name: Start container and probe /health
        run: |
          docker run -d --name scraper-smoke -p 8400:8000 python-smart-scraper:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8400/health; then
              echo; echo "healthy after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          docker logs scraper-smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f scraper-smoke
